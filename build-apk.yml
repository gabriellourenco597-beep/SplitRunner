name: Build SplitRunner APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar projeto Android
        run: |
          rm -rf android
          flutter create --platforms=android --project-name splitrunner .

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitRunner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
