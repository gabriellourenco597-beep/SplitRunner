name: Build SplitRunner APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Install native Overlay files
        run: |
          mkdir -p android/app/src/main/kotlin/com/splitrunner

          cp MainActivity.kt \
            android/app/src/main/kotlin/com/splitrunner/MainActivity.kt

          cp OverlayService.kt \
            android/app/src/main/kotlin/com/splitrunner/OverlayService.kt

      - name: Fix package names
        run: |
          sed -i 's/package com\.example\.[^ ]*/package com.splitrunner/' \
            android/app/src/main/kotlin/com/splitrunner/MainActivity.kt

          sed -i 's/package com\.example\.[^ ]*/package com.splitrunner/' \
            android/app/src/main/kotlin/com/splitrunner/OverlayService.kt

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          if "android.permission.SYSTEM_ALERT_WINDOW" not in text:
              text = text.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n\n    <application',
                  1
              )

          if 'android:name=".OverlayService"' not in text:
              text = text.replace(
                  '</application>',
                  '''<service
              android:name=".OverlayService"
              android:exported="false"
              android:stopWithTask="false" />
          </application>'''
              )

          p.write_text(text)
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitRunner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
