name: Build SplitRunner APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com \
            --project-name splitrunner \
            .

      - name: Configure Android package
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.splitrunner"/' android/app/build.gradle.kts || true
          sed -i 's/applicationId ".*"/applicationId "com.splitrunner"/' android/app/build.gradle || true
          sed -i 's/namespace = ".*"/namespace = "com.splitrunner"/' android/app/build.gradle.kts || true
          sed -i 's/namespace ".*"/namespace "com.splitrunner"/' android/app/build.gradle || true

      - name: Install MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/splitrunner
          cp MainActivity.kt android/app/src/main/kotlin/com/splitrunner/MainActivity.kt

      - name: Install OverlayService
        run: |
          cp OverlayService.kt android/app/src/main/kotlin/com/splitrunner/OverlayService.kt

      - name: Configure AndroidManifest
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />'

          if permission not in text:
              pos = text.find('>')
              text = text[:pos+1] + '\n    ' + permission + text[pos+1:]

          service = '''
              <service
                  android:name=".OverlayService"
                  android:exported="false"
                  android:stopWithTask="false" />
          '''

          if '.OverlayService' not in text:
              text = text.replace(
                  '</application>',
                  service + '\n    </application>'
              )

          manifest.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Remove old Flutter test
        run: rm -rf test

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitRunner-APK
          path: build/app/outputs/flutter-apk/app-release.apk           
