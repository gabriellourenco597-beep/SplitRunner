name: Build SplitRunner APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android .

      - name: Configure SplitRunner Android package
        run: |
          mkdir -p android/app/src/main/kotlin/com/splitrunner

          cp MainActivity.kt \
            android/app/src/main/kotlin/com/splitrunner/MainActivity.kt

          cp OverlayService.kt \
            android/app/src/main/kotlin/com/splitrunner/OverlayService.kt

          cp AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          sed -i 's/applicationId "com.example.[^"]*"/applicationId "com.splitrunner"/' android/app/build.gradle
          sed -i 's/namespace = "com.example.[^"]*"/namespace = "com.splitrunner"/' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitRunner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
