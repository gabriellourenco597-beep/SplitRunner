name: Build SplitRunner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR O PROJETO
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALAR FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ============================================================
      # 3. CRIAR A ESTRUTURA ANDROID
      # ============================================================
      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.splitrunner \
            .


      # ============================================================
      # 4. PREPARAR PASTAS KOTLIN
      # ============================================================
      - name: Prepare Android files
        run: |
          mkdir -p android/app/src/main/kotlin/com/splitrunner


      # ============================================================
      # 5. COPIAR MAINACTIVITY
      # ============================================================
      - name: Install MainActivity
        run: |
          if [ -f MainActivity.kt ]; then
            cp MainActivity.kt \
            android/app/src/main/kotlin/com/splitrunner/MainActivity.kt
          else
            echo "MainActivity.kt não encontrado"
            exit 1
          fi


      # ============================================================
      # 6. COPIAR OVERLAYSERVICE
      # ============================================================
      - name: Install OverlayService
        run: |
          if [ -f OverlayService.kt ]; then
            cp OverlayService.kt \
            android/app/src/main/kotlin/com/splitrunner/OverlayService.kt
          else
            echo "OverlayService.kt não encontrado"
            exit 1
          fi


      # ============================================================
      # 7. CONFIGURAR ANDROIDMANIFEST
      # ============================================================
      - name: Configure AndroidManifest
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          # Permissão de overlay
          if "android.permission.SYSTEM_ALERT_WINDOW" not in text:
              text = text.replace(
                  "<manifest",
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"'
              )

              marker = ">"

              pos = text.find(marker)

              text = (
                  text[:pos+1]
                  + '\n'
                  + '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n'
                  + '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                  + '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n'
                  + '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  + text[pos+1:]
              )

          # Serviço do Overlay
          if "OverlayService" not in text:
              service = '''
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Display speedrun timer overlay over other applications" />
                  </service>
              '''

              text = text.replace(
                  "</application>",
                  service + "\n    </application>"
              )

          manifest.write_text(text)
          PY


      # ============================================================
      # 8. DEPENDÊNCIAS
      # ============================================================
      - name: Get dependencies
        run: |
          flutter pub get


      # ============================================================
      # 9. LIMPAR PROJETO
      # ============================================================
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get


      # ============================================================
      # 10. GERAR APK
      # ============================================================
      - name: Build APK
        run: |
          flutter build apk --release


      # ============================================================
      # 11. ENVIAR APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitRunner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error              
