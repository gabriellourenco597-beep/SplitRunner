name: Build SplitRunner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com \
            --project-name splitrunner \
            .


      - name: Get dependencies
        run: |
          flutter pub get


      - name: Install MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/splitrunner
          cp MainActivity.kt android/app/src/main/kotlin/com/splitrunner/MainActivity.kt


      - name: Install OverlayService
        run: |
          cp OverlayService.kt android/app/src/main/kotlin/com/splitrunner/OverlayService.kt


      - name: Create AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="SplitRunner"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Speedrun timer overlay" />

                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

              </application>

          </manifest>
          EOF


      - name: Verify Android files
        run: |
          echo "===== MainActivity ====="
          cat android/app/src/main/kotlin/com/splitrunner/MainActivity.kt

          echo "===== OverlayService ====="
          cat android/app/src/main/kotlin/com/splitrunner/OverlayService.kt

          echo "===== AndroidManifest ====="
          cat android/app/src/main/AndroidManifest.xml


      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get


      - name: Build APK
        run: |
          flutter build apk --release


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitRunner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error           
